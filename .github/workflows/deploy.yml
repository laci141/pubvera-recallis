name: Build and Deploy Recallis

# pull_request runs every check below against the proposed change, but never
# publishes an image: the GHCR login and the push are both gated on the event
# not being a pull_request. Watchtower on the server deploys whatever :latest
# points at, so a PR that could push :latest would deploy unmerged code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # govulncheck is PINNED, not @latest. Every step in this job gates the image
  # build, so a new release that reports a finding the previous one did not
  # would stop a deploy that has nothing to do with the change being pushed.
  # Bump this deliberately and read the diff, rather than being bumped by it.
  # Same version as pubvera-grantvera, so the two apps are judged alike.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Formatting and vet run BEFORE the tests: both finish in under a second,
      # and there is no reason to spend the test run's seconds discovering a
      # problem that a byte comparison already knows about.
      #
      # gofmt compares the bytes on disk. The runner checks out with LF line
      # endings, which is what gofmt expects. On a Windows worktree with CRLF
      # the same command lists every file as unformatted — a false positive —
      # so the local equivalent is gofmt -l on the staged LF copy
      # (git show :file), never gofmt -w on the worktree. Measured before adding
      # this step: every tracked .go file, taken from HEAD, is gofmt-clean.
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "run gofmt on an LF copy, never 'gofmt -w' on a CRLF worktree"
            exit 1
          fi
          echo "all Go files are gofmt-clean"

      # go vet finds what the compiler does not: Printf verbs that do not match
      # their arguments, a lock copied by value, unreachable code. None of those
      # stop a build, and all of them ship. Measured clean before adding it.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches — so
      # a finding here is one that affects this binary, not a theoretical entry
      # in a database.
      #
      # It runs after the tests because it is the slowest of the three checks
      # and the one least likely to fire. It scans this module only; the
      # drug-enforcement CLI is a separate binary, built from a pinned upstream
      # commit in the Dockerfile, and is not covered.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The image carries the upstream commit its CLI was built from as the
      # label org.pubvera.cli.commit. That label shipped EMPTY on e67ee7c: the
      # default lived on an ARG inside cli-builder, and the runtime stage's
      # bare ARG never saw it. Nothing failed — the build, the tests and the
      # deploy were all green — so this builds the image locally first and
      # compares the label with the commit pinned in the Dockerfile, BEFORE
      # anything is pushed. A mismatch stops the job, so an image that cannot
      # say where its CLI came from never reaches :latest.
      #
      # The second build below reuses the gha cache this one fills, so the
      # extra cost is the load into the runner's Docker, not a rebuild.
      - name: Build image for the label check
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: recallis-label-check:ci
          cache-from: type=gha

      - name: Check the CLI commit label
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ARG PP_LIBRARY_COMMIT=//p' Dockerfile)
          actual=$(docker image inspect recallis-label-check:ci --format '{{ index .Config.Labels "org.pubvera.cli.commit" }}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Dockerfile has no global 'ARG PP_LIBRARY_COMMIT=<40-hex commit>' line"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "label org.pubvera.cli.commit does not match the commit pinned in the Dockerfile"
            exit 1
          fi
          echo "label matches the pinned commit"

      # Skipped on pull_request: a PR build proves the image builds, but has no
      # reason to hold registry credentials.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull_request the image is built but not pushed, so :latest — and
      # therefore what Watchtower deploys — only ever moves on main.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max